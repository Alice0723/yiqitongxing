<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>活动列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/events">艺起同行</a>
    <div class="home-nav-links">
        <a href="/" class="btn btn-outline-secondary btn-sm">返回首页</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <span th:if="${currentUser != null}" class="me-2">欢迎，<span th:text="${currentUser.username}"></span></span>
        <span th:if="${currentUser != null}">
            <a th:if="${currentUser.role == 'ROLE_USER'}" href="/growth" class="btn btn-outline-success btn-sm me-2">美育成长</a>
            <a href="/group-purchase" class="btn btn-outline-warning btn-sm me-2">拼团购票</a>
            <a th:if="${currentUser.role == 'ROLE_ADMIN'}" href="/admin/dashboard" class="btn btn-outline-dark btn-sm me-2">管理后台</a>
            <a th:if="${currentUser.role == 'ROLE_TEACHER'}" href="/teacher/dashboard" class="btn btn-outline-dark btn-sm me-2">教师后台</a>
            <a th:if="${currentUser.role == 'ROLE_THEATER'}" href="/theater/dashboard" class="btn btn-outline-dark btn-sm me-2">剧院后台</a>
            <a href="/profile" class="btn btn-outline-info btn-sm me-2">个人中心</a>
            <a href="/my-orders" class="btn btn-outline-primary btn-sm me-2">我的订单</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
        </span>
        <span th:if="${currentUser == null}">
            <a href="/login" class="btn btn-outline-primary btn-sm me-2">登录</a>
            <a href="/register" class="btn btn-outline-success btn-sm">注册</a>
        </span>
    </span>
</nav>

<div class="container mt-4 mb-4">
    <div class="hero-card mb-3">
        <div class="section-title">发现下一场心动演出</div>
        <div class="section-subtitle">结合你的兴趣偏好、热门趋势与近期演出热度，为你智能排序推荐。</div>
    </div>

    <div class="filter-bar mb-3">
        <form class="row g-2" method="get" action="/events">
            <div class="col-md-3"><input class="form-control" name="keyword" placeholder="关键词（名称/描述/场馆）" th:value="${keyword}"></div>
            <div class="col-md-2"><input class="form-control" name="venue" placeholder="按场馆筛选" th:value="${venue}"></div>
            <div class="col-md-2"><input class="form-control" type="date" name="date" th:value="${date}"></div>
            <div class="col-md-2">
                <select class="form-select" name="tag">
                    <option value="">全部标签</option>
                    <option th:each="t : ${tagOptions}" th:value="${t}" th:text="${t}" th:selected="${selectedTag == t}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select" name="sort">
                    <option value="recommended" th:selected="${sort == 'recommended'}">智能推荐</option>
                    <option value="timeAsc" th:selected="${sort == 'timeAsc'}">时间升序</option>
                    <option value="timeDesc" th:selected="${sort == 'timeDesc'}">时间降序</option>
                    <option value="priceAsc" th:selected="${sort == 'priceAsc'}">价格升序</option>
                    <option value="priceDesc" th:selected="${sort == 'priceDesc'}">价格降序</option>
                    <option value="ticketsDesc" th:selected="${sort == 'ticketsDesc'}">余票优先</option>
                </select>
            </div>
            <div class="col-md-1 d-grid"><button class="btn btn-brand" type="submit">筛选</button></div>
        </form>
        <div class="quick-tags mt-2">
            <a class="btn btn-outline-secondary btn-sm me-1 mb-1" th:href="@{/events(keyword=${keyword},venue=${venue},date=${date},sort=${sort})}">全部</a>
            <a class="btn btn-outline-primary btn-sm me-1 mb-1" th:each="t : ${tagOptions}" th:text="${t}" th:href="@{/events(keyword=${keyword},venue=${venue},date=${date},tag=${t},sort=${sort})}"></a>
        </div>
        <div class="small-muted mt-2">当前结果 <strong th:text="${eventCount}"></strong> 场</div>
    </div>

    <div class="alert alert-success-soft" th:if="${studentVerified}">你已通过学生认证，当前显示学生特惠价。</div>
    <div class="mb-3">
        <strong>AI推荐标签：</strong>
        <span class="event-tag me-1" th:each="tag : ${aiTags}" th:text="${tag}"></span>
        <div class="small text-muted mt-1" th:if="${recommendMode == 'personalized'}">推荐依据：你的兴趣标签与近期购票行为。</div>
        <div class="small text-muted mt-1" th:if="${recommendMode == 'coldStart'}">推荐依据：全站热门标签与即将开演活动。</div>
    </div>

    <div class="row" th:if="${!events.isEmpty()}">
        <div class="col-md-4 mb-3" th:each="event,stat : ${events}">
            <div class="event-card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${event.name}">活动名称</h5>
                    <p class="event-meta mb-2">
                        场馆: <span th:text="${event.venue}"></span><br>
                        时间: <span th:text="${#temporals.format(event.startTime, 'yyyy-MM-dd HH:mm')}"></span><br>
                        原价: ¥<span th:text="${event.price}"></span><br>
                        学生价: ¥<span th:text="${studentPrices[stat.index]}"></span><br>
                        余票: <span th:text="${event.remainingTickets}"></span>
                    </p>
                    <div class="mb-3">
                        <span th:if="${event.tags == null or #strings.isEmpty(event.tags)}" class="small-muted">暂无标签</span>
                        <span th:if="${event.tags != null and !#strings.isEmpty(event.tags)}" class="event-tag me-1" th:each="tag : ${#strings.arraySplit(event.tags, ',')}" th:text="${tag}"></span>
                    </div>
                    <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-brand w-100">查看详情</a>
                </div>
            </div>
        </div>
    </div>

    <div class="glass-card p-4 text-center" th:if="${events.isEmpty()}">
        <h5 class="mb-2">暂无匹配活动</h5>
        <p class="small-muted mb-3">换个关键词、标签或时间再试试。</p>
        <a class="btn btn-outline-primary" href="/events">清空筛选</a>
    </div>
</div>
</body>
</html>
