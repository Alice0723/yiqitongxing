<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生认证审核</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺起同行 - 学生认证审核</a>
    <div class="home-nav-links">
        <a href="/" class="btn btn-outline-primary btn-sm">返回首页</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="card glass-card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">待审核学生认证申请</h5>
                </div>
                <div class="card-body">
                    <div th:if="${applications.isEmpty()}" class="alert alert-info">
                        暂无待审核申请
                    </div>
                    <div th:unless="${applications.isEmpty()}">
                        <div class="table-responsive table-card">
                            <table class="table table-striped table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>申请ID</th>
                                        <th>用户名</th>
                                        <th>实名</th>
                                        <th>学校/年级</th>
                                        <th>学号</th>
                                        <th>申请时间</th>
                                        <th>学生证</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="app : ${applications}">
                                        <td th:text="${app.id}"></td>
                                        <td th:text="${app.user.username}"></td>
                                        <td th:text="${app.realName}"></td>
                                        <td><span th:text="${app.schoolName}"></span> / <span th:text="${app.grade}"></span></td>
                                        <td th:text="${app.studentNo}"></td>
                                        <td th:text="${#temporals.format(app.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <a th:href="${app.certificatePath}" target="_blank" class="btn btn-sm btn-info">查看照片</a>
                                        </td>
                                        <td>
                                            <!-- 审核通过模态 -->
                                            <button type="button" class="btn btn-sm btn-success" data-bs-toggle="modal" th:data-bs-target="'#approveModal' + ${app.id}">
                                                通过
                                            </button>
                                            <!-- 审核拒绝模态 -->
                                            <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" th:data-bs-target="'#rejectModal' + ${app.id}">
                                                拒绝
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 审核通过模态框 -->
                        <div th:each="app : ${applications}" th:id="'approveModal' + ${app.id}" class="modal fade" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">审核通过</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <form th:action="@{/admin/student-auth/{id}/approve(id=${app.id})}" method="post">
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label for="remarks" class="form-label">审核备注（可选）</label>
                                                <textarea class="form-control" id="remarks" name="remarks" rows="3" placeholder="输入审核备注..."></textarea>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                            <button type="submit" class="btn btn-success">确认通过</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- 审核拒绝模态框 -->
                        <div th:each="app : ${applications}" th:id="'rejectModal' + ${app.id}" class="modal fade" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">审核拒绝</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <form th:action="@{/admin/student-auth/{id}/reject(id=${app.id})}" method="post">
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label for="remarks" class="form-label">拒绝理由</label>
                                                <textarea class="form-control" id="remarks" name="remarks" rows="3" placeholder="输入拒绝理由..." required></textarea>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                            <button type="submit" class="btn btn-danger">确认拒绝</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
