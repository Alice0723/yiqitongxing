<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拼团购票</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="container mt-4 page-shell">
<h2>拼团购票</h2>
<a href="/events" class="btn btn-outline-secondary btn-sm mb-3">返回活动</a>

<div class="card glass-card mb-3">
    <div class="card-body">
        <h5>发起班级/社团团购</h5>
        <form method="post" action="/group-purchase/create" class="row g-2">
            <div class="col-md-5">
                <select name="eventId" class="form-select" required>
                    <option value="">选择活动</option>
                    <option th:each="e : ${events}" th:value="${e.id}" th:text="${e.name}"></option>
                </select>
            </div>
            <div class="col-md-3"><input name="targetSize" type="number" class="form-control" value="30" min="2"></div>
            <div class="col-md-2"><button class="btn btn-brand w-100" type="submit">发起拼团</button></div>
        </form>
    </div>
</div>

<div class="table-card"><table class="table table-bordered mb-0">
    <thead><tr><th>ID</th><th>活动</th><th>发起人</th><th>进度</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
    <tr th:each="g : ${groups}">
        <td th:text="${g.id}"></td>
        <td th:text="${g.event.name}"></td>
        <td th:text="${g.initiator.username}"></td>
        <td><span th:text="${g.currentSize}"></span>/<span th:text="${g.targetSize}"></span></td>
        <td><span class="badge bg-warning" th:text="${g.status}"></span></td>
        <td>
            <form th:action="@{/group-purchase/{id}/join(id=${g.id})}" method="post" style="display:inline;">
                <button class="btn btn-sm btn-success" type="submit">参团</button>
            </form>
            <a th:href="@{/group-purchase/{id}(id=${g.id})}" class="btn btn-sm btn-outline-primary">详情</a>
        </td>
    </tr>
    </tbody>
</table></div>
</body>
</html>
