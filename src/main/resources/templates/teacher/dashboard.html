!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>教师后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺起同行 · 教师后台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
        <div class="home-nav-links">
            <a href="/" class="btn btn-outline-secondary btn-sm me-2">返回首页</a>
            <a href="/admin/dashboard" class="btn btn-outline-info btn-sm me-2">管理后台</a>
            <a href="/theater/dashboard" class="btn btn-outline-info btn-sm">剧院后台</a>
        </div>
        <span class="home-nav-auth ms-auto">
            <span th:if="${currentUser != null}" class="me-2">欢迎�?span th:text="${currentUser.username}"></span></span>
            <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm me-2">个人中心</a>
            <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
        </span>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <section class="hero-card mb-4">
        <div class="section-kicker">教师后台</div>
        <div class="section-title">班级、作业与批改</div>
        <div class="section-subtitle">布置作业、管理班级、批改学生观演报告�?/div>
    </section>
<div class="card glass-card mb-3"><div class="card-body">
    <h5>布置作业</h5>
    <form action="/teacher/homework/create" method="post" class="row g-2">
        <div class="col-md-3"><input class="form-control" name="title" placeholder="作业标题" required></div>
        <div class="col-md-3"><input class="form-control" name="requirements" placeholder="作业要求" required></div>
        <div class="col-md-2"><input class="form-control" type="datetime-local" name="dueAt" required></div>
        <div class="col-md-2">
            <select class="form-select" name="eventId" required>
                <option value="">关联演出</option>
                <option th:each="e : ${events}" th:value="${e.id}" th:text="${e.name}"></option>
            </select>
        </div>
                <div class="col-md-2">
                    <select class="form-select" name="classroomId" required>
                        <option value="">选择班级</option>
                        <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.className}"></option>
                    </select>
                </div>
        <div class="col-md-1"><input class="form-control" type="number" name="creditReward" min="0" value="1" required></div>
        <div class="col-md-1"><button class="btn btn-primary w-100" type="submit">发布</button></div>
    </form>
</div></div>

<div class="card glass-card mb-3"><div class="card-body">
    <h5>新增班级</h5>
    <form action="/teacher/classes/create" method="post" class="row g-2">
        <div class="col-md-4"><input class="form-control" name="className" placeholder="班级名称" required></div>
        <div class="col-md-3"><input class="form-control" type="number" name="studentCount" placeholder="人数" required></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">创建</button></div>
    </form>
</div></div>

<h5>已布置作�?/h5>
<div class="table-card mb-4"><table class="table table-bordered mb-0">
        <thead><tr><th>标题</th><th>关联演出</th><th>班级</th><th>截止时间</th><th>可得学分</th><th>状�?/th></tr></thead>
    <tbody>
    <tr th:each="h : ${homeworks}">
        <td th:text="${h.title}"></td>
        <td th:text="${h.event != null ? h.event.name : '-'}"></td>
            <td th:text="${h.classroom != null ? h.classroom.className : '不限'}"></td>
        <td th:text="${#temporals.format(h.dueAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${h.creditReward}"></td>
        <td th:text="${h.status}"></td>
    </tr>
    </tbody>
</table></div>

<h5>班级列表</h5>
<div class="table-card mb-4"><table class="table table-bordered mb-0"><thead><tr><th>班级</th><th>人数</th><th>完成�?/th></tr></thead><tbody><tr th:each="c : ${classes}"><td th:text="${c.className}"></td><td th:text="${c.studentCount}"></td><td th:text="${c.completionRate}"></td></tr></tbody></table></div>

<h5>作业批改</h5>
<div class="table-card"><table class="table table-bordered mb-0"><thead><tr><th>学生</th><th>标题</th><th>操作</th></tr></thead><tbody>
<tr th:each="r : ${pendingReports}">
    <td th:text="${r.user.username}"></td>
    <td th:text="${r.title}"></td>
    <td>
        <form th:action="@{/teacher/reports/{id}/grade(id=${r.id})}" method="post" class="d-flex gap-2">
            <input class="form-control" type="number" name="score" min="0" max="100" placeholder="分数" required>
            <input class="form-control" name="comment" placeholder="评语">
            <button class="btn btn-success" type="submit">提交</button>
        </form>
    </td>
</tr>
</tbody></table></div>
</body>
</html>
