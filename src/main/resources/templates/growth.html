<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>美育成长中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="container mt-4 page-shell">
<h2>美育成长中心</h2>
<div class="mb-3">
    <a href="/events" class="btn btn-outline-secondary btn-sm">返回活动</a>
</div>
<div class="row g-3 mb-3" th:if="${studentUser}">
    <div class="col-md-3"><div class="card glass-card"><div class="card-body">我的积分：<strong th:text="${user.points}"></strong></div></div></div>
    <div class="col-md-3"><div class="card glass-card"><div class="card-body">我的学分：<strong th:text="${user.credits}"></strong></div></div></div>
</div>

<div class="alert alert-secondary" th:if="${!studentUser}">
    当前账号角色无需积分与作业提交，仅可查看推荐课程。
</div>

<div class="card glass-card mb-3" th:if="${studentUser}">
    <div class="card-body">
        <h5>提交观演作业</h5>
        <form action="/growth/report/submit" method="post" enctype="multipart/form-data">
            <div class="mb-2">
                <label>选择老师布置作业</label>
                <select class="form-select" name="homeworkId" required>
                    <option value="">请选择作业</option>
                    <option th:each="h : ${homeworks}" th:value="${h.id}" th:text="${h.title + '（' + h.event.name + '） 截止:' + #temporals.format(h.dueAt, 'MM-dd HH:mm') + ' 学分:' + (h.creditReward == null ? 0 : h.creditReward)}"></option>
                </select>
            </div>
            <div class="mb-2"><label>标题</label><input class="form-control" name="title" required></div>
            <div class="mb-2"><label>内容</label><textarea class="form-control" name="content" rows="4" required></textarea></div>
            <div class="mb-2"><label>附件</label><input class="form-control" type="file" name="attachment"></div>
            <button class="btn btn-brand" type="submit">提交作业</button>
        </form>
    </div>
</div>

<div class="row" th:if="${studentUser}">
    <div class="col-md-6">
        <h5>我的作业</h5>
        <div class="table-card"><table class="table table-sm table-bordered mb-0">
            <thead><tr><th>标题</th><th>状态</th><th>评分</th></tr></thead>
            <tbody><tr th:each="r : ${reports}"><td th:text="${r.title}"></td><td th:text="${r.status}"></td><td th:text="${r.score}"></td></tr></tbody>
        </table></div>
    </div>
    <div class="col-md-6">
        <h5>积分明细</h5>
        <div class="table-card"><table class="table table-sm table-bordered mb-0">
            <thead><tr><th>说明</th><th>积分</th><th>时间</th></tr></thead>
            <tbody><tr th:each="p : ${pointRecords}"><td th:text="${p.description}"></td><td th:text="${p.points}"></td><td th:text="${#temporals.format(p.createdAt, 'MM-dd HH:mm')}"></td></tr></tbody>
        </table></div>
    </div>
</div>

<div class="mt-3">
    <h5>AI推荐课程</h5>
    <div class="list-group glass-card">
        <a th:each="c : ${recommendedCourses}" class="list-group-item list-group-item-action" th:href="${c.videoUrl}" target="_blank">
            <span th:text="${c.title}"></span> <small class="text-muted" th:text="${c.tags}"></small>
        </a>
    </div>
</div>
</body>
</html>
