<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拼团详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2 mb-3">
    <a class="navbar-brand app-brand" href="/">艺起同行</a>
    <div class="home-nav-links">
        <a href="/group-purchase" class="btn btn-outline-primary btn-sm">返回拼团</a>
        <a href="/events" class="btn btn-outline-primary btn-sm">活动列表</a>
    </div>
</nav>
<div class="container mt-4 mb-5">
<section class="hero-card mb-4">
    <div class="section-kicker">拼团详情</div>
    <div class="section-title">#<span th:text="${group.id}"></span></div>
    <div class="section-subtitle">活动：<strong th:text="${group.event.name}"></strong></div>
    <div class="hero-inline-meta mt-3"><span>进度 <strong th:text="${group.currentSize} + '/' + ${group.targetSize}"></strong></span></div>
</section>

<div class="table-card"><table class="table table-striped mb-0">
    <thead><tr><th>成员</th><th>加入时间</th></tr></thead>
    <tbody>
    <tr th:each="m : ${members}">
        <td th:text="${m.user.username}"></td>
        <td th:text="${#temporals.format(m.joinedAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table></div>
</div>
</body>
</html>
