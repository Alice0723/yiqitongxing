<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>演出排期 - 艺启同行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺启同行</a>
    <div class="home-nav-links">
        <a href="/schedule" class="btn btn-outline-primary btn-sm">演出排期</a>
        <a href="/groupbuy" class="btn btn-outline-primary btn-sm">拼团购票</a>
        <a href="/points" class="btn btn-outline-primary btn-sm">积分商城</a>
        <a href="/ai-recommend" class="btn btn-outline-primary btn-sm">AI推荐</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a th:if="${currentUser == null}" href="/login" class="btn btn-outline-primary btn-sm me-2">登录</a>
        <a th:if="${currentUser == null}" href="/register" class="btn btn-outline-success btn-sm me-2">注册</a>
        <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm">个人中心</a>
        <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container mt-4 mb-5">
    <section class="hero-card mb-4">
        <div class="section-kicker">演出排期</div>
        <div class="section-title">全部排期</div>
        <div class="section-subtitle">全部交响音乐会、歌剧、音乐剧、舞剧、民族音乐、室内乐和钢琴独奏。</div>
        <div class="hero-inline-meta mt-3">
            <span th:each="tag : ${tagOptions}" th:text="${tag}"></span>
        </div>
    </section>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-value" th:text="${eventCount}">0</div>
                <div class="metric-label">场精彩演出</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-value" th:text="${openGroupCount}">0</div>
                <div class="metric-label">个拼团招募中</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <div class="metric-value" th:text="${studentVerified ? '已认证' : '待认证'}"></div>
                <div class="metric-label">学生身份状态</div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-4" th:each="event : ${featuredEvents}">
            <div class="show-card">
                <div class="poster-block poster-d">
                    <div class="poster-badge" th:text="${event.tags != null and !#strings.isEmpty(event.tags) ? event.tags : '交响音乐会'}"></div>
                    <div class="poster-name" th:text="${event.name}"></div>
                </div>
                <div class="p-3">
                    <div class="show-meta">
                        <span th:text="${event.venue}"></span>
                    </div>
                    <div class="show-submeta mt-1">
                        <span th:text="${event.startTime != null ? #temporals.format(event.startTime, 'yyyy-MM-dd HH:mm') : '-'}"></span>
                        · ¥<span th:text="${event.price}"></span>
                        · 余票 <span th:text="${event.remainingTickets}"></span>
                    </div>
                    <p class="show-desc mt-2" th:text="${event.description}"></p>
                    <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-brand w-100">立即购票</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
