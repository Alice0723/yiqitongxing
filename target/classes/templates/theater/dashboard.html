!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>剧院后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2 mb-3">
    <a class="navbar-brand app-brand" href="/">艺起同行 · 剧院后台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
        <div class="home-nav-links">
            <a href="/" class="btn btn-outline-secondary btn-sm me-2">返回首页</a>
            <a href="/admin/dashboard" class="btn btn-outline-info btn-sm me-2">管理后台</a>
            <a href="/teacher/dashboard" class="btn btn-outline-info btn-sm">教师后台</a>
        </div>
        <span class="home-nav-auth ms-auto">
            <span th:if="${currentUser != null}" class="me-2">欢迎�?span th:text="${currentUser.username}"></span></span>
            <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm me-2">个人中心</a>
            <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
        </span>
    </div>
</nav>
<div class="container mt-4 mb-5">
<section class="hero-card mb-4">
    <div class="section-kicker">剧院后台</div>
    <div class="section-title">上架演出与同步排�?/div>
    <div class="section-subtitle">管理院团档期、活动和渠道订单�?/div>
</section>
<div class="card glass-card mb-4"><div class="card-body">
    <h5>上架演出</h5>
    <form action="/theater/events/create" method="post" class="row g-2">
        <div class="col-md-3"><input class="form-control" name="name" placeholder="演出名称" required></div>
        <div class="col-md-2"><input class="form-control" name="venue" placeholder="演出剧场" required></div>
        <div class="col-md-2"><input class="form-control" type="datetime-local" name="startTime" required></div>
        <div class="col-md-1"><input class="form-control" type="number" name="price" min="0" placeholder="票价" required></div>
        <div class="col-md-3">
            <select class="form-select" name="seatTemplate" required>
                <option value="">选择剧场座位�?/option>
                <option th:each="tpl : ${seatTemplates}" th:value="${tpl.key()}" th:text="${tpl.label() + ' / 总座�?' + tpl.capacity()}"></option>
            </select>
        </div>
        <div class="col-md-1"><button class="btn btn-brand w-100" type="submit">上架</button></div>
        <div class="col-md-12">
            <label class="form-label">演出标签（可多选）</label>
            <div class="d-flex flex-wrap gap-2">
                <label class="form-check form-check-inline" th:each="tag : ${eventTagOptions}">
                    <input class="form-check-input" type="checkbox" name="tags" th:value="${tag}">
                    <span class="form-check-label" th:text="${tag}"></span>
                </label>
            </div>
        </div>
        <div class="col-md-12"><textarea class="form-control" name="description" rows="2" placeholder="演出描述"></textarea></div>
    </form>
</div></div>

<div class="card glass-card mb-4"><div class="card-body">
    <h5>排期同步</h5>
    <form action="/theater/schedule/sync" method="post" class="row g-2">
        <div class="col-md-4"><input class="form-control" name="eventName" placeholder="演出名称" required></div>
        <div class="col-md-3"><input class="form-control" name="venue" placeholder="剧院" required></div>
        <div class="col-md-3"><input class="form-control" type="datetime-local" name="startTime" required></div>
        <div class="col-md-2"><button class="btn btn-brand w-100" type="submit">同步</button></div>
    </form>
</div></div>

<h5>档期列表</h5>
    <div class="table-card mb-4"><table class="table table-bordered mb-0"><thead><tr><th>演出</th><th>剧院</th><th>时间</th><th>状�?/th></tr></thead><tbody><tr th:each="s : ${schedules}"><td th:text="${s.eventName}"></td><td th:text="${s.venue}"></td><td th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${s.status}"></td></tr></tbody></table></div>

<h5>渠道订单</h5>
    <div class="table-card"><table class="table table-bordered mb-0"><thead><tr><th>订单�?/th><th>活动</th><th>用户</th><th>状�?/th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.event.name}"></td><td th:text="${o.user.username}"></td><td th:text="${o.status}"></td></tr></tbody></table></div>
</div>
</body>
</html>
