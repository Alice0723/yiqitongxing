<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>运营分析 - 艺启同行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺启同行</a>
    <div class="home-nav-links">
        <a href="/analytics" class="btn btn-outline-primary btn-sm">运营分析</a>
        <a href="/admin/dashboard" class="btn btn-outline-primary btn-sm">管理后台</a>
        <a href="/schedule" class="btn btn-outline-primary btn-sm">演出排期</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container-fluid mt-4 mb-5">
    <section class="hero-card mb-4">
        <div class="section-kicker">运营分析</div>
        <div class="section-title">第38届上海之春国际音乐节</div>
        <div class="section-subtitle">运营总览、用户、演出和票务统计。</div>
    </section>

    <div class="row g-3 mb-4">
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${eventCount}"></div><div class="metric-label">演出数</div></div></div>
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${groupCount}"></div><div class="metric-label">拼团数</div></div></div>
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${reportCount}"></div><div class="metric-label">报告数</div></div></div>
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${approvedStudentCount}"></div><div class="metric-label">学生数</div></div></div>
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${soldTickets}"></div><div class="metric-label">售出票</div></div></div>
        <div class="col-md-2"><div class="metric-card"><div class="metric-value" th:text="${seatRate + '%'}"></div><div class="metric-label">上座率</div></div></div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="table-card h-100">
                <table class="table table-bordered mb-0">
                    <thead><tr><th>用户</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.role}"></td>
                        <td th:text="${u.blacklisted ? '黑名单' : '正常'}"></td>
                        <td><span class="small-muted">已在管理后台可操作</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="table-card mb-4">
                <table class="table table-bordered mb-0">
                    <thead><tr><th>活动</th><th>场馆</th><th>时间</th><th>余票</th></tr></thead>
                    <tbody>
                    <tr th:each="e : ${events}">
                        <td th:text="${e.name}"></td>
                        <td th:text="${e.venue}"></td>
                        <td th:text="${e.startTime != null ? #temporals.format(e.startTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                        <td th:text="${e.remainingTickets}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="table-card">
                <table class="table table-bordered mb-0">
                    <thead><tr><th>标签</th></tr></thead>
                    <tbody><tr><td th:text="${#strings.listJoin(eventTagOptions, ' / ')}"></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
