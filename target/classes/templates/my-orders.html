<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的订单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺起同行</a>
    <div class="home-nav-links">
        <a href="/" class="btn btn-outline-primary btn-sm">首页</a>
        <a href="/groupbuy" class="btn btn-outline-primary btn-sm">拼团购票</a>
        <a href="/points" class="btn btn-outline-primary btn-sm">积分商城</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>
<div class="container mt-4 mb-4">
    <section class="hero-card mb-4">
        <div class="section-kicker">订单中心</div>
        <div class="section-title">我的订单</div>
        <div class="section-subtitle">查看待支付、已支付和已退票记录。</div>
    </section>
    <div th:if="${param.paid}" class="alert alert-success">支付成功！</div>
    <div th:if="${param.error}" class="alert alert-danger">支付失败，可能余票不足</div>
    <div th:if="${param.timeout}" class="alert alert-warning">锁座已超时（5分钟），座位已自动释放。</div>
    <div th:if="${param.refunded}" class="alert alert-success">退票成功，票数已返还。</div>
    <div th:if="${param.refundError}" class="alert alert-danger">退票失败，仅已支付订单可退票。</div>
    <div class="table-card">
    <table class="table table-bordered mb-0">
        <thead>
        <tr>
            <th>订单号</th><th>活动名称</th><th>座位</th><th>数量</th><th>总价</th><th>状态</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.event.name}"></td>
            <td th:text="${order.seatCodes}"></td>
            <td th:text="${order.quantity}"></td>
            <td th:text="${order.totalPrice}"></td>
            <td>
                <span th:if="${order.status == 'PENDING'}" class="badge bg-warning">待支付</span>
                <span th:if="${order.status == 'PAID'}" class="badge bg-success">已支付</span>
                <span th:if="${order.status == 'REFUNDED'}" class="badge bg-secondary">已退票</span>
                <span th:if="${order.status == 'CANCELLED'}" class="badge bg-dark">超时取消</span>
            </td>
            <td>
                <a th:if="${order.status == 'PENDING'}" th:href="@{/order/{id}/pay(id=${order.id})}" class="btn btn-sm btn-primary">去支付</a>
                <form th:if="${order.status == 'PAID'}" th:action="@{/order/{id}/refund(id=${order.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('确认退票吗？');">退票</button>
                </form>
                <span th:if="${order.status != 'PENDING' and order.status != 'PAID'}">-</span>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
