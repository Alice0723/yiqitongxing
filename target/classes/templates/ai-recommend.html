<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI推荐 - 艺启同行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺启同行</a>
    <div class="home-nav-links">
        <a href="/schedule" class="btn btn-outline-primary btn-sm">演出排期</a>
        <a href="/groupbuy" class="btn btn-outline-primary btn-sm">拼团购票</a>
        <a href="/points" class="btn btn-outline-primary btn-sm">积分商城</a>
        <a href="/ai-recommend" class="btn btn-outline-primary btn-sm">AI推荐</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a th:if="${currentUser == null}" href="/login" class="btn btn-outline-primary btn-sm me-2">登录</a>
        <a th:if="${currentUser == null}" href="/register" class="btn btn-outline-success btn-sm me-2">注册</a>
        <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm">个人中心</a>
        <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container mt-4 mb-5">
    <section class="home-hero hero-card mb-4">
        <div class="row align-items-center g-4">
            <div class="col-lg-8">
                <div class="home-kicker">AI推荐</div>
                <h1 class="home-title">根据你的兴趣和行为，推荐最适合的演出</h1>
                <p class="home-lead">推荐依据：你的兴趣标签与近期购票行为。</p>
                <div class="feature-tags mt-3">
                    <span class="tag-pill" th:each="tag : ${aiTags}" th:text="${tag}"></span>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="feature-spotlight">
                    <div class="feature-label" th:text="${recommendMode == 'personalized' ? '个性化推荐' : '冷启动推荐'}"></div>
                    <div class="feature-title">当前共 <span th:text="${eventCount}"></span> 场可选演出</div>
                    <div class="small-muted">把热门趋势和你的偏好一起排到前面。</div>
                </div>
            </div>
        </div>
    </section>

    <div class="row g-3">
        <div class="col-lg-4" th:each="event : ${recommendedEvents}">
            <div class="show-card h-100">
                <div class="poster-block poster-b">
                    <div class="poster-badge" th:text="${event.tags != null and !#strings.isEmpty(event.tags) ? event.tags : '热门推荐'}"></div>
                    <div class="poster-name" th:text="${event.name}"></div>
                </div>
                <div class="p-3">
                    <div class="show-meta" th:text="${event.venue}"></div>
                    <div class="show-submeta mt-1">
                        <span th:text="${event.startTime != null ? #temporals.format(event.startTime, 'MM-dd HH:mm') : '-'}"></span>
                        · ¥<span th:text="${event.price}"></span>
                    </div>
                    <p class="show-desc mt-2" th:text="${event.description}"></p>
                    <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-brand w-100">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
