<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拼团购票 - 艺启同行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺启同行</a>
    <div class="home-nav-links">
        <a href="/schedule" class="btn btn-outline-primary btn-sm">演出排期</a>
        <a href="/groupbuy" class="btn btn-outline-primary btn-sm">拼团购票</a>
        <a href="/points" class="btn btn-outline-primary btn-sm">积分商城</a>
        <a href="/ai-recommend" class="btn btn-outline-primary btn-sm">AI推荐</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a th:if="${currentUser == null}" href="/login" class="btn btn-outline-primary btn-sm me-2">登录</a>
        <a th:if="${currentUser == null}" href="/register" class="btn btn-outline-success btn-sm me-2">注册</a>
        <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm">个人中心</a>
        <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container mt-4 mb-5">
    <section class="hero-card mb-4">
        <div class="section-kicker">拼团购票，最高5折</div>
        <div class="section-title">与同学组团买票，人越多价越低</div>
        <div class="section-subtitle">目前有 <strong th:text="${openGroupCount}"></strong> 个拼团正在招募中。</div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <a href="#create-group" class="btn btn-brand">立即组团</a>
            <a href="#group-list" class="btn btn-outline-primary">查看全部拼团</a>
        </div>
    </section>

    <div class="glass-card p-4 mb-4" id="create-group">
        <h5 class="mb-3">发起班级/社团团购</h5>
        <form method="post" action="/group-purchase/create" class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label">选择活动</label>
                <select name="eventId" class="form-select" required>
                    <option value="">选择活动</option>
                    <option th:each="e : ${events}" th:value="${e.id}" th:text="${e.name}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">目标人数</label>
                <input name="targetSize" type="number" class="form-control" value="30" min="2">
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-brand" type="submit">发起拼团</button>
            </div>
        </form>
    </div>

    <div class="row g-3" id="group-list">
        <div class="col-lg-4" th:each="g : ${groups}">
            <div class="mini-group-card h-100">
                <div class="mini-group-title" th:text="${g.event.name}"></div>
                <div class="mini-group-meta">发起人 <span th:text="${g.initiator.username}"></span></div>
                <div class="mini-group-progress mt-2">进度 <span th:text="${g.currentSize}"></span>/<span th:text="${g.targetSize}"></span> 人</div>
                <div class="mt-2"><span class="badge bg-warning text-dark" th:text="${g.status}"></span></div>
                <div class="d-flex gap-2 mt-3">
                    <form th:action="@{/group-purchase/{id}/join(id=${g.id})}" method="post">
                        <button class="btn btn-sm btn-light" type="submit">参团</button>
                    </form>
                    <a th:href="@{/group-purchase/{id}(id=${g.id})}" class="btn btn-sm btn-outline-light">详情</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
