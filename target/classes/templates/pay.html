<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>支付订单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺起同行</a>
    <div class="home-nav-links">
        <a href="/events" class="btn btn-outline-primary btn-sm">返回活动</a>
        <a href="/my-orders" class="btn btn-outline-primary btn-sm">我的订单</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>
<div class="container mt-4 mb-5">
    <section class="hero-card mb-4">
        <div class="section-kicker">订单支付</div>
        <div class="section-title">确认支付并完成锁座</div>
        <div class="section-subtitle">请在倒计时结束前完成支付，超时后座位会自动释放。</div>
    </section>
    <div class="card glass-card">
        <div class="card-header">
            订单支付
        </div>
        <div class="card-body">
            <h5 class="card-title">订单号：<span th:text="${order.id}"></span></h5>
            <p>活动：<span th:text="${order.event.name}"></span></p>
            <p>数量：<span th:text="${order.quantity}"></span></p>
            <p>座位：
                <span th:if="${seatCodes == null or seatCodes.isEmpty()}">未选择</span>
                <span th:unless="${seatCodes == null or seatCodes.isEmpty()}" th:text="${seatCodes}"></span>
            </p>
            <p>总金额：¥<span th:text="${order.totalPrice}"></span></p>
            <p>状态：<span class="badge bg-warning" th:text="${order.status}"></span></p>
            <div th:if="${order.status == 'PENDING'}" class="alert alert-warning">
                锁座倒计时：<strong id="lockCountdown" th:text="${remainingSeconds}"></strong> 秒（超时自动释放）
            </div>
            <form th:action="@{/order/{id}/pay(id=${order.id})}" method="post">
                <button type="submit" class="btn btn-brand">确认支付（模拟）</button>
                <a href="/my-orders" class="btn btn-secondary">稍后支付</a>
            </form>
        </div>
    </div>
</div>
<script th:if="${order.status == 'PENDING'}">
    (function () {
        const node = document.getElementById('lockCountdown');
        if (!node) return;
        let sec = parseInt(node.textContent || '0', 10);
        const timer = setInterval(() => {
            sec -= 1;
            if (sec <= 0) {
                clearInterval(timer);
                node.textContent = '0';
                window.location.href = '/my-orders?timeout';
                return;
            }
            node.textContent = String(sec);
        }, 1000);
    })();
</script>
</body>
</html>
