<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生中心 - 艺启同行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺启同行</a>
    <div class="home-nav-links">
        <a href="/schedule" class="btn btn-outline-primary btn-sm">演出排期</a>
        <a href="/groupbuy" class="btn btn-outline-primary btn-sm">拼团购票</a>
        <a href="/points" class="btn btn-outline-primary btn-sm">积分商城</a>
        <a href="/ai-recommend" class="btn btn-outline-primary btn-sm">AI推荐</a>
    </div>
    <span class="home-nav-auth ms-auto">
        <a th:if="${currentUser == null}" href="/login" class="btn btn-outline-primary btn-sm me-2">登录</a>
        <a th:if="${currentUser == null}" href="/register" class="btn btn-outline-success btn-sm me-2">注册</a>
        <a th:if="${currentUser != null}" href="/profile" class="btn btn-outline-info btn-sm">个人中心</a>
        <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container mt-4 mb-5">
    <section class="home-hero hero-card mb-4">
        <div class="row align-items-center g-4">
            <div class="col-lg-7">
                <div class="home-kicker">手拉手课堂</div>
                <h1 class="home-title">美育成长中心</h1>
                <p class="home-lead">由顶尖艺术院校教师倾力打造，在线学习随时随地。</p>
                <div class="home-meta-strip mt-4">
                    <span>当前积分 <strong th:text="${user.points}"></strong></span>
                    <span>当前学分 <strong th:text="${user.credits}"></strong></span>
                    <span th:if="${studentAuth != null}">认证状态 <strong th:text="${studentAuth.status}"></strong></span>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="feature-spotlight">
                    <div class="feature-label">观后感积分</div>
                    <div class="feature-title">发布观后感得 +1 积分</div>
                    <div class="small-muted">学生认证后可提交作业、获取学分和更多推荐。</div>
                </div>
            </div>
        </div>
    </section>

    <div class="row g-3 mb-4" th:if="${studentUser}">
        <div class="col-md-4">
            <div class="metric-card"><div class="metric-value" th:text="${user.points}"></div><div class="metric-label">我的积分</div></div>
        </div>
        <div class="col-md-4">
            <div class="metric-card"><div class="metric-value" th:text="${user.credits}"></div><div class="metric-label">我的学分</div></div>
        </div>
        <div class="col-md-4">
            <div class="metric-card"><div class="metric-value" th:text="${reports.size()}"></div><div class="metric-label">我的作业</div></div>
        </div>
    </div>

    <div class="alert alert-secondary" th:if="${!studentUser}">当前账号角色无需积分与作业提交，仅可查看推荐课程。</div>

    <div class="row g-4" th:if="${studentUser}">
        <div class="col-lg-6">
            <div class="glass-card p-4 h-100">
                <h5 class="mb-3">提交观演作业</h5>
                <form action="/growth/report/submit" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">选择老师布置作业</label>
                        <select class="form-select" name="homeworkId" required>
                            <option value="">请选择作业</option>
                            <option th:each="h : ${homeworks}" th:value="${h.id}" th:text="${h.title + '（' + h.event.name + '） 截止:' + #temporals.format(h.dueAt, 'MM-dd HH:mm') + ' 学分:' + (h.creditReward == null ? 0 : h.creditReward)}"></option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">标题</label><input class="form-control" name="title" required></div>
                    <div class="mb-3"><label class="form-label">内容</label><textarea class="form-control" name="content" rows="4" required></textarea></div>
                    <div class="mb-3"><label class="form-label">附件</label><input class="form-control" type="file" name="attachment"></div>
                    <button class="btn btn-brand" type="submit">提交作业</button>
                </form>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="glass-card p-4 mb-3">
                <h5 class="mb-3">我的作业</h5>
                <div class="table-card">
                    <table class="table table-sm table-bordered mb-0">
                        <thead><tr><th>标题</th><th>状态</th><th>评分</th></tr></thead>
                        <tbody><tr th:each="r : ${reports}"><td th:text="${r.title}"></td><td th:text="${r.status}"></td><td th:text="${r.score}"></td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="glass-card p-4">
                <h5 class="mb-3">积分明细</h5>
                <div class="table-card">
                    <table class="table table-sm table-bordered mb-0">
                        <thead><tr><th>说明</th><th>积分</th><th>时间</th></tr></thead>
                        <tbody><tr th:each="p : ${pointRecords}"><td th:text="${p.description}"></td><td th:text="${p.points}"></td><td th:text="${#temporals.format(p.createdAt, 'MM-dd HH:mm')}"></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <h5 class="mb-3">AI推荐课程</h5>
        <div class="row g-3">
            <div class="col-md-6 col-xl-3" th:each="c : ${recommendedCourses}">
                <a class="course-card glass-card d-block text-decoration-none h-100" th:href="${c.videoUrl}" target="_blank">
                    <div class="course-tag" th:text="${c.tags}"></div>
                    <div class="course-title" th:text="${c.title}"></div>
                    <div class="course-info mt-2" th:text="${c.description}"></div>
                </a>
            </div>
        </div>
    </div>

    <div class="mt-4" th:if="${notifications != null and !notifications.isEmpty()}">
        <h5 class="mb-3">通知</h5>
        <div class="row g-3">
            <div class="col-md-6" th:each="n : ${notifications}">
                <div class="glass-card p-3">
                    <div class="fw-bold" th:text="${n.title}"></div>
                    <div class="small-muted" th:text="${n.content}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
