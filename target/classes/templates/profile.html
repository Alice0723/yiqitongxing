<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-shell home-shell">
<nav class="navbar navbar-expand-lg app-navbar px-3 py-2">
    <a class="navbar-brand app-brand" href="/">艺起同行</a>
    <div class="home-nav-links">
        <!-- empty center nav -->
    </div>
    <span class="home-nav-auth ms-auto">
        <span class="me-2">欢迎，<span th:text="${user.username}"></span></span>
        <a href="/" class="btn btn-outline-primary btn-sm me-2">首页</a>
        <a href="/my-orders" class="btn btn-outline-primary btn-sm me-2">我的订单</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
    </span>
</nav>

<div class="container mt-4 mb-4">
    <div class="alert alert-success" th:if="${param.accountSuccess != null}">账号信息已更新。</div>
    <div class="alert alert-danger" th:if="${accountError != null}" th:text="${accountError}"></div>
    <div class="row">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">个人信息</h5>
                </div>
                <div class="card-body">
                    <p><strong>用户名：</strong> <span th:text="${user.username}"></span></p>
                    <p><strong>用户ID：</strong> <span th:text="${user.id}"></span></p>
                    <p><strong>角色：</strong> <span th:text="${user.role}"></span></p>
                    <p th:if="${studentUser}"><strong>学校：</strong> <span th:text="${user.schoolName}"></span></p>
                    <p th:if="${studentUser}"><strong>年级：</strong> <span th:text="${user.grade}"></span></p>
                    <p th:if="${studentUser}"><strong>我的积分：</strong> <span th:text="${user.points}"></span></p>
                    <p th:if="${studentUser}"><strong>我的学分：</strong> <span th:text="${user.credits}"></span></p>
                    <a th:if="${studentUser}" href="/growth" class="btn btn-outline-success btn-sm me-2">美育成长中心</a>
                    <a href="/group-purchase" class="btn btn-outline-warning btn-sm me-2">拼团中心</a>
                    <a th:if="${user.role == 'ROLE_ADMIN'}" href="/admin/dashboard" class="btn btn-outline-dark btn-sm me-2">管理员后台</a>
                    <a th:if="${user.role == 'ROLE_TEACHER'}" href="/teacher/dashboard" class="btn btn-outline-dark btn-sm me-2">教师后台</a>
                    <a th:if="${user.role == 'ROLE_THEATER'}" href="/theater/dashboard" class="btn btn-outline-dark btn-sm">剧院后台</a>
                    <form action="/profile/deactivate" method="post" class="mt-3" onsubmit="return confirm('确认注销账号？注销后将无法登录。');">
                        <button type="submit" class="btn btn-outline-danger btn-sm">注销账号</button>
                    </form>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">修改用户名和密码</h5>
                </div>
                <div class="card-body">
                    <form action="/profile/account" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">新用户名</label>
                            <input class="form-control" name="newUsername" th:value="${user.username}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">当前密码</label>
                            <input class="form-control" type="password" name="currentPassword" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">新密码</label>
                            <input class="form-control" type="password" name="newPassword" placeholder="留空则不修改密码">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">确认新密码</label>
                            <input class="form-control" type="password" name="confirmPassword" placeholder="留空则不修改密码">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-secondary">保存账号信息</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card" th:if="${studentUser}">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">学生认证状态</h5>
                </div>
                <div class="card-body">
                    <div th:if="${studentAuth == null}">
                        <p class="text-muted">还未申请学生认证</p>
                        <a href="/student-auth" class="btn btn-primary">申请认证</a>
                    </div>
                    <div th:unless="${studentAuth == null}">
                        <p>
                            <strong>认证状态：</strong>
                            <span th:if="${studentAuth.status == 'PENDING'}" class="badge bg-warning">待审核</span>
                            <span th:if="${studentAuth.status == 'APPROVED'}" class="badge bg-success">已认证</span>
                            <span th:if="${studentAuth.status == 'REJECTED'}" class="badge bg-danger">已拒绝</span>
                        </p>
                        <p><strong>申请时间：</strong> <span th:text="${#temporals.format(studentAuth.applyTime, 'yyyy-MM-dd HH:mm')}"></span></p>
                        <div th:if="${studentAuth.reviewTime != null}">
                            <p><strong>审核时间：</strong> <span th:text="${#temporals.format(studentAuth.reviewTime, 'yyyy-MM-dd HH:mm')}"></span></p>
                            <p><strong>审核人：</strong> <span th:text="${studentAuth.reviewedBy}"></span></p>
                        </div>
                        <div th:if="${studentAuth.remarks != null}">
                            <p><strong>审核备注：</strong> <span th:text="${studentAuth.remarks}"></span></p>
                        </div>
                        <div th:if="${studentAuth.status == 'REJECTED'}">
                            <a href="/student-auth" class="btn btn-primary btn-sm">重新申请</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3" th:if="${studentUser}">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">兴趣标签设置（用于AI推荐）</h5>
                </div>
                <div class="card-body">
                    <form action="/profile/interests" method="post">
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <label class="form-check form-check-inline" th:each="tag : ${eventTagOptions}">
                                <input class="form-check-input" type="checkbox" name="interestTags" th:value="${tag}" th:checked="${selectedInterestTags.contains(tag)}">
                                <span class="form-check-label" th:text="${tag}"></span>
                            </label>
                        </div>
                        <button class="btn btn-info btn-sm" type="submit">保存兴趣标签</button>
                    </form>
                </div>
            </div>

            <div class="alert alert-secondary" th:if="${!studentUser}">
                当前账号角色无需学生认证与学生积分学分模块。
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 mb-3 text-muted">
    <p>&copy; 艺启同行</p>
</footer>
</body>
</html>
